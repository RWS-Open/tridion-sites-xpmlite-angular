@for (bannerComponent of region()?.components; track bannerComponent.id) {
<headless-xpm-editor [tcmId]="'tcm:'+bannerComponent.publicationId+'-'+bannerComponent.itemId"
  containerStyle="border:1px solid blue" class="demo demo123">
  <section class="banner w-100 position-relative" [attr.data-region]="region()?.name">
    @for (item of bannerComponent.itemListElement; track item; let idx=$index) {
    <div [attr.data-component]="bannerComponent.title">
      <div>
        <img [src]="item.media.variants.edges[0].node.downloadUrl" alt=""
          class="img-fluid d-block w-100 banner-image-style" />
      </div>
      <div class="container-fluid position-absolute"
        style="bottom: 50%; width: 100%; left: 50%; transform: translate(-50%, 50%)">
        <div class="row align-items-center justify-content-start">
          <div class="col-lg-5 ml-4 pl-4 text-center solar-banner mx-auto">
            <h1 class="h4 text-white banner-text text-uppercase position-relative animated fadeInUp"
              [attr.xpm-editable-field-name]="item | fieldNamePipe: item.subheading"
              [attr.xpm-editable-field-position]="idx"
            >
              {{ item.subheading }}
            </h1>
            <a href="#lightbox" data-toggle="modal"
              class="btn btn-light mt-4 py-3 px-4 jmb-btn text-uppercase animated fadeInUp delay-1s"
              [attr.xpm-editable-field-name]="item.link | fieldNamePipe: item.link.linkText"
              [attr.xpm-editable-field-position]="idx"
              >
              {{ item.link.linkText }}</a>
          </div>
        </div>
      </div>
    </div>
    }
  </section>
</headless-xpm-editor>
<div class="modal fade and carousel slide position-fixed" id="lightbox">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <div id="carousel-1654" class="carousel slide h-100" data-ride="carousel">
          <div class="carousel-inner h-100">
            <div class="carousel-item active">
              <div class="w-100">
                <img src="https://preview.tridiondemo.com/content/img/segment-marketo-contacts.png" alt=""
                  class="w-100 animated fadeIn" />
              </div>
            </div>
            <div class="carousel-item">
              <div class="w-100">
                <img src="https://preview.tridiondemo.com/content/img/see savings form.png" alt=""
                  class="w-100 animated fadeIn" />
              </div>
            </div>
            <div class="carousel-item">
              <div class="w-100">
                <img src="https://preview.tridiondemo.com/content/img/salesforce-crm.png" alt=""
                  class="w-100 animated fadeIn" />
              </div>
            </div>
          </div>
          <a class="carousel-control-prev" href="#carousel-1654" role="button" data-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="sr-only">Previous</span>
          </a>
          <a class="carousel-control-next" href="#carousel-1654" role="button" data-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="sr-only">Next</span>
          </a>
        </div>
      </div>
    </div>
  </div>
</div>


}
