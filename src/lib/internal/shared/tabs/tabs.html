<app-tab-header></app-tab-header>
<div class="tab-header">
    @for(tab of tabs; track tab.label; let i = $index){
        <button (click)="selectTab(i)" [disabled]="tab.disabled" [class.active]="activeIndex===i">
            {{tab.label}}
        </button>
    }
</div>
<div>
    @if(tabs.length > 0) {
    <ng-container>
        @if(tabs.toArray()[activeIndex]?.template){
            <ng-container >
            </ng-container>
        }
    </ng-container>
    }
</div>
<ng-content></ng-content>
