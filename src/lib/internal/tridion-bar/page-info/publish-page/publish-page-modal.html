<app-modal 
    title="Publish" 
    [okButtonText]="isPublishing() ? 'Publishing...' : 'Publish'" 
    cancelButtonText="Cancel"
    [isOpen]="showPublishModal()" 
    [showOkButton]="true" 
    [showCancelButton]="true"
    (okButton)="onPublishPage()"
    (closeButton)="togglePublishingModal()" 
    [template]="pagePublishModal"
    [disableOkButton]="!isDisabled() || isPublishing()">
</app-modal>

<ng-template #pagePublishModal>
    <app-publish-tabs>
        <app-publish-tab title="General" [component]="generalTab" />
        <app-publish-tab title="Additional Settings" [component]="additionalSettingsTab" />
        <!--  <app-publish-tab title="Items to Publish" [component]="publishItemsTab" /> -->
    </app-publish-tabs>
</ng-template>
